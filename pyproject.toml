[project]
name = "makalahmcp"
version = "0.1.0"
description = "MCP server for generating Indonesian academic papers (makalah)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
    "beautifulsoup4>=4.13.4",
    "python-docx>=1.1.2",
    "fpdf2>=2.8.3",
    "pypdf>=5.0.0",
    "fastapi>=0.115.0",
]
